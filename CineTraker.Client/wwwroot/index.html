<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineTraker.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CineTraker.Client.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="manifest.json" rel="manifest" />
    <meta name="theme-color" content="#121212" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        window.inicializarScrollInfinito = (dotNetHelper) => {
            window.onscroll = () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    dotNetHelper.invokeMethodAsync('CargarSiguientePagina');
                }
            };
        };
    </script>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <script>
        let network = null;
        let nodes = null;
        let edges = null;
        let dotNetReference = null;

        // --- NUEVO: Paleta de colores para los niveles de las flechas ---
        const coloresPorNivel = [
            "#2B7CE9", // Nivel 0 (No se usa en flechas, pero ocupa el índice)
            "#2B7CE9", // Nivel 1: Azul (El color original)
            "#FF5722", // Nivel 2: Naranja
            "#9C27B0", // Nivel 3: Morado
            "#E91E63", // Nivel 4: Rosa fuerte
            "#00BCD4", // Nivel 5: Cyan
            "#4CAF50", // Nivel 6: Verde
            "#FFC107"  // Nivel 7+: Dorado
        ];

        function getColorArista(nivel) {
            // Si el nivel es mayor a los colores que tenemos, usa el último (Dorado)
            return coloresPorNivel[Math.min(nivel, coloresPorNivel.length - 1)];
        }

        const opcionesGrafo = {
            interaction: { hover: true, hoverConnectedEdges: true },
            physics: {
                enabled: true,
                solver: 'repulsion',
                repulsion: {
                    nodeDistance: 250,
                    springLength: 250,
                    springConstant: 0.01,
                    damping: 0.9
                },
                stabilization: { iterations: 50 }
            },
            nodes: { borderWidth: 3, shadow: { enabled: true, color: 'rgba(0,0,0,0.8)', size: 15 } },
            edges: { width: 2, shadow: { enabled: true, color: 'rgba(0,0,0,0.8)', size: 10 }, arrows: 'to' }
        };

        window.inicializarGrafo = (data, dotNetHelper) => {
            dotNetReference = dotNetHelper;
            const container = document.getElementById('graph-container');
            if (!container) return;

            if (network !== null) {
                network.destroy();
                network = null;
            }

            const nodosRaw = data.nodos || data.Nodos;
            const aristasRaw = data.aristas || data.Aristas;

            // Al inicio, la semilla es nivel 0 y las primeras recomendaciones son nivel 1
            nodes = new vis.DataSet(nodosRaw.map(n => transformarNodo(n, n.grupo === "Central" ? 0 : 1)));
            edges = new vis.DataSet(aristasRaw.map(e => transformarArista(e, 1)));

            network = new vis.Network(container, { nodes, edges }, opcionesGrafo);

            network.on("stabilizationIterationsDone", function () {
                network.setOptions({ physics: false });
            });

            configurarEventosClic();
            bloquearNodosPadres();
        };

        function configurarEventosClic() {
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const nodoClickeado = nodes.get(nodeId);

                    if (nodoClickeado && nodoClickeado.expandido) return;
                    dotNetReference.invokeMethodAsync('SeleccionarPeliculaDesdeMapa', nodeId);
                }
            });

            network.on("dragEnd", function (params) {
                if (params.nodes.length > 0) {
                    dotNetReference.invokeMethodAsync('GuardarMovimientoManual');
                }
            });

            network.on("hoverNode", function (params) {
                const nodeId = params.node;
                const nodoHovered = nodes.get(nodeId);
                const tooltip = document.getElementById("custom-tooltip");
                if (nodoHovered && tooltip) {
                    // Colores según grupo
                    const colorTitulo = nodoHovered.grupo === "Continuidad" ? "#00bcd4" : (nodoHovered.grupo === "Ruptura" ? "#ff5722" : "#ffc107");
                    
                    tooltip.innerHTML = `
                        <div style="font-weight: 800; font-size: 1.1rem; color: ${colorTitulo}; margin-bottom: 2px;">${nodoHovered.label}</div>
                        <div style="font-size: 0.85rem; color: #ccc; text-transform: uppercase; letter-spacing: 1px;">${nodoHovered.grupo}</div>
                    `;
                    tooltip.style.display = "block";
                    tooltip.style.opacity = "1";
                    
                    tooltip.style.left = (params.pointer.DOM.x + 15) + "px";
                    tooltip.style.top = (params.pointer.DOM.y + 15) + "px";
                }
            });

            network.on("blurNode", function (params) {
                const tooltip = document.getElementById("custom-tooltip");
                if (tooltip) {
                    tooltip.style.display = "none";
                    tooltip.style.opacity = "0";
                }
            });
        }

        // NUEVO: Agregamos el parámetro 'nivel' para guardarlo en el nodo
        function transformarNodo(n, nivelAsignado = 0) {
            const id = n.id || n.Id;
            const titulo = n.titulo || n.Titulo;
            const posterUrl = n.posterUrl || n.PosterUrl;
            const grupo = n.grupo || n.Grupo;
            const esVisto = n.isWatched || n.IsWatched;
            const yaExpandido = n.expandido || n.Expandido || false;

            // Si el nodo ya venía con un nivel guardado, lo usamos. Si no, usamos el nuevo.
            const nivelActual = n.nivel !== undefined ? n.nivel : nivelAsignado;
            const esSemilla = (grupo === "Central");

            return {
                id: id,
                label: titulo,
                grupo: grupo, // Lo guardamos explícitamente para el tooltip
                shape: 'circularImage',
                image: posterUrl,
                size: esSemilla ? 50 : 35,
                color: {
                    border: yaExpandido ? "#ffc107" : (esVisto ? "#6c757d" : (esSemilla ? "#0078d4" : "#28a745")),
                    background: "#1a1a1a"
                },
                imagePadding: 0,
                shapeProperties: { useImageSize: false },
                chosen: true,
                font: { color: '#ffffff', strokeWidth: 3, strokeColor: '#000000', size: 16, face: 'sans-serif' },
                opacity: (esVisto || yaExpandido) ? 0.6 : 1,
                expandido: yaExpandido,
                nivel: nivelActual, 

                x: esSemilla ? 0 : (n.x || undefined),
                y: esSemilla ? 0 : (n.y || undefined),
                fixed: esSemilla ? { x: true, y: true } : false
            };
        }

        // NUEVO: Le pasamos el nivel a la flecha para que pinte el color
        function transformarArista(e, nivel = 1) {
            const source = e.sourceId || e.SourceId;
            const target = e.targetId || e.TargetId;
            const relacion = e.relacion || e.Relacion;
            const colorArista = getColorArista(nivel); // Buscamos el color en la paleta

            const isRuptura = relacion === "Cambio de aires";

            return {
                from: source,
                to: target,
                label: relacion,
                color: { color: colorArista, highlight: colorArista, hover: colorArista }, // Aplicamos el color
                dashes: isRuptura, // Ruptura es línea punteada
                width: isRuptura ? 2 : 4 // Continuidad es más gruesa
            };
        }

        window.inyectarNodos = (nuevoGrafo) => {
            const nuevosNodosRaw = nuevoGrafo.nodos || nuevoGrafo.Nodos;
            const nuevasAristasRaw = nuevoGrafo.aristas || nuevoGrafo.Aristas;

            if (nuevasAristasRaw.length === 0) return;

            const parentId = nuevasAristasRaw[0].sourceId || nuevasAristasRaw[0].SourceId;
            const parentPos = network.getPositions([parentId])[parentId];
            const nodoPadre = nodes.get(parentId);

            if (!parentPos || !nodoPadre) return;

            const padreX = parentPos.x;
            const padreY = parentPos.y;
            const nuevoNivel = (nodoPadre.nivel || 0) + 1;

            // 1. Calcular angulo base (desde abuelo a padre)
            let anguloBase = 0;
            const edgeHaciaPadre = edges.get({ filter: e => e.to === parentId });
            if (edgeHaciaPadre.length > 0) {
                const abueloId = edgeHaciaPadre[0].from;
                const abueloPos = network.getPositions([abueloId])[abueloId];
                if (abueloPos) {
                    anguloBase = Math.atan2(padreY - abueloPos.y, padreX - abueloPos.x);
                } else {
                    anguloBase = Math.atan2(padreY, padreX);
                }
            } else if (padreX !== 0 || padreY !== 0) {
                anguloBase = Math.atan2(padreY, padreX);
            }

            // 2. Agregar los nodos nuevos al dataset
            const nodosAAgregar = [];
            const aristasAAgregar = [];

            nuevosNodosRaw.forEach((n) => {
                const id = n.id || n.Id;
                if (!nodes.get(id)) {
                    let nodoNuevo = transformarNodo(n, nuevoNivel); 
                    nodoNuevo.fixed = false; 
                    nodosAAgregar.push(nodoNuevo);
                }
            });

            nuevasAristasRaw.forEach(e => {
                const source = e.sourceId || e.SourceId;
                const target = e.targetId || e.TargetId;
                const exists = edges.get({ filter: (item) => item.from === source && item.to === target });
                if (exists.length === 0) {
                    aristasAAgregar.push(transformarArista(e, nuevoNivel)); 
                }
            });

            nodes.add(nodosAAgregar);
            edges.add(aristasAAgregar);

            // 3. Reacomodar a TODOS los hijos de este padre en un abanico
            const todosLosHijosEdges = edges.get({ filter: e => e.from === parentId });
            const hijosIds = todosLosHijosEdges.map(e => e.to);
            
            if (hijosIds.length > 0) {
                // A mayor cantidad de hijos, más abrimos el abanico para que no se encimen
                const spread = hijosIds.length > 3 ? Math.PI : (Math.PI / 1.5); 
                const radioRadial = 250; 
                
                const actualizaciones = [];
                hijosIds.forEach((hijoId, index) => {
                    let anguloCálculo = anguloBase;
                    if (padreX === 0 && padreY === 0) {
                        // Si es la semilla, repartimos en 360 grados
                        anguloCálculo = (2 * Math.PI / hijosIds.length) * index;
                    } else if (hijosIds.length > 1) {
                        // Distribuimos equitativamente a lo largo del 'spread'
                        const offset = (index / (hijosIds.length - 1)) * spread - (spread / 2);
                        anguloCálculo += offset;
                    }

                    actualizaciones.push({
                        id: hijoId,
                        x: padreX + radioRadial * Math.cos(anguloCálculo),
                        y: padreY + radioRadial * Math.sin(anguloCálculo)
                    });
                });
                
                nodes.update(actualizaciones);
            }
        };

        window.centrarMapa = () => {
            if (network) {
                network.fit({
                    animation: {
                        duration: 800,
                        easingFunction: "easeInOutQuad"
                    }
                });
            }
        };

        window.marcarNodoComoExpandido = (id) => {
            if (nodes && nodes.get(id)) {
                nodes.update({
                    id: id,
                    expandido: true,
                    color: { border: "#ffc107" },
                    opacity: 0.6
                });
            }
        };

        window.obtenerSnapshotGrafo = () => {
            if (!network || !nodes || !edges) return "";
            const posiciones = network.getPositions();
            const nodosSnapshot = nodes.get().map(n => {
                return {
                    ...n,
                    x: posiciones[n.id] ? posiciones[n.id].x : 0,
                    y: posiciones[n.id] ? posiciones[n.id].y : 0,
                    expandido: n.expandido,
                    nivel: n.nivel // Guardamos el nivel en la DB para que no se pierda el color al recargar
                };
            });
            const aristasSnapshot = edges.get();
            return JSON.stringify({ nodos: nodosSnapshot, aristas: aristasSnapshot });
        };

        window.obtenerIdsNodos = () => {
            if (!nodes) return [];
            return nodes.getIds();
        };

        window.cargarMapaDesdeJson = (jsonString, dotNetHelper) => {
            dotNetReference = dotNetHelper;
            const container = document.getElementById('graph-container');
            if (!container || !jsonString) return;

            const data = JSON.parse(jsonString);

            // Sanitización de mapas viejos que traían el 'title' (tooltip feo) y no tenían 'grupo'
            const nodosSaneados = (data.nodos || []).map(n => {
                if (n.title) {
                    if (!n.grupo) {
                        const match = n.title.match(/<i>(.*?)<\/i>/);
                        n.grupo = match ? match[1] : (n.grupo || "Central");
                    }
                    delete n.title;
                }
                if (!n.grupo && n.id === data.nodos[0]?.id) n.grupo = "Central";
                return n;
            });

            nodes = new vis.DataSet(nodosSaneados);
            edges = new vis.DataSet(data.aristas);

            const configCarga = { ...opcionesGrafo, physics: { enabled: false } };
            network = new vis.Network(container, { nodes, edges }, configCarga);

            configurarEventosClic();
            bloquearNodosPadres();

            const arrayNodos = nodes.get();
            if (arrayNodos.length > 0) {
                const ultimoNodoId = arrayNodos[arrayNodos.length - 1].id;

                setTimeout(() => {
                    network.focus(ultimoNodoId, {
                        scale: 1.2, 
                        animation: {
                            duration: 1200, 
                            easingFunction: "easeInOutQuad"
                        }
                    });
                }, 100);
            }
        };


        window.fijarNodoSemilla = (id) => {
            if (nodes && nodes.get(id)) {
                nodes.update({
                    id: id,
                    x: 0,
                    y: 0,
                    fixed: { x: true, y: true }
                });
            }
        };

        function bloquearNodosPadres() {
            if (!nodes || !edges) return;
            const aristas = edges.get();
            const nodosPadresIds = [...new Set(aristas.map(e => e.from))];

            nodosPadresIds.forEach(id => {
                const nodo = nodes.get(id);
                if (nodo && !nodo.expandido) {
                    nodes.update({
                        id: id,
                        expandido: true,
                        color: { border: "#ffc107" },
                        opacity: 0.6
                    });
                }
            });
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>

</html>
