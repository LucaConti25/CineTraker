<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineTraker.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CineTraker.Client.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        window.inicializarScrollInfinito = (dotNetHelper) => {
            window.onscroll = () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    dotNetHelper.invokeMethodAsync('CargarSiguientePagina');
                }
            };
        };
    </script>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <script>
        let network = null;
        let nodes = null;
        let edges = null;
        let dotNetReference = null;

        // --- NUEVO: Paleta de colores para los niveles de las flechas ---
        const coloresPorNivel = [
            "#2B7CE9", // Nivel 0 (No se usa en flechas, pero ocupa el índice)
            "#2B7CE9", // Nivel 1: Azul (El color original)
            "#FF5722", // Nivel 2: Naranja
            "#9C27B0", // Nivel 3: Morado
            "#E91E63", // Nivel 4: Rosa fuerte
            "#00BCD4", // Nivel 5: Cyan
            "#4CAF50", // Nivel 6: Verde
            "#FFC107"  // Nivel 7+: Dorado
        ];

        function getColorArista(nivel) {
            // Si el nivel es mayor a los colores que tenemos, usa el último (Dorado)
            return coloresPorNivel[Math.min(nivel, coloresPorNivel.length - 1)];
        }

        const opcionesGrafo = {
            physics: {
                enabled: true,
                solver: 'repulsion',
                repulsion: {
                    nodeDistance: 180,
                    springLength: 200,
                    springConstant: 0.01,
                    damping: 0.9
                },
                stabilization: { iterations: 50 }
            },
            nodes: { borderWidth: 3, shadow: true },
            edges: { width: 2, shadow: true, arrows: 'to' }
        };

        window.inicializarGrafo = (data, dotNetHelper) => {
            dotNetReference = dotNetHelper;
            const container = document.getElementById('graph-container');
            if (!container) return;

            if (network !== null) {
                network.destroy();
                network = null;
            }

            const nodosRaw = data.nodos || data.Nodos;
            const aristasRaw = data.aristas || data.Aristas;

            // Al inicio, la semilla es nivel 0 y las primeras recomendaciones son nivel 1
            nodes = new vis.DataSet(nodosRaw.map(n => transformarNodo(n, n.grupo === "Central" ? 0 : 1)));
            edges = new vis.DataSet(aristasRaw.map(e => transformarArista(e, 1)));

            network = new vis.Network(container, { nodes, edges }, opcionesGrafo);

            network.on("stabilizationIterationsDone", function () {
                network.setOptions({ physics: false });
            });

            configurarEventosClic();
            bloquearNodosPadres();
        };

        function configurarEventosClic() {
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const nodoClickeado = nodes.get(nodeId);

                    if (nodoClickeado && nodoClickeado.expandido) return;
                    dotNetReference.invokeMethodAsync('SeleccionarPeliculaDesdeMapa', nodeId);
                }
            });

            network.on("dragEnd", function (params) {
                if (params.nodes.length > 0) {
                    dotNetReference.invokeMethodAsync('GuardarMovimientoManual');
                }
            });
        }

        // NUEVO: Agregamos el parámetro 'nivel' para guardarlo en el nodo
        function transformarNodo(n, nivelAsignado = 0) {
            const id = n.id || n.Id;
            const titulo = n.titulo || n.Titulo;
            const posterUrl = n.posterUrl || n.PosterUrl;
            const grupo = n.grupo || n.Grupo;
            const esVisto = n.isWatched || n.IsWatched;
            const yaExpandido = n.expandido || n.Expandido || false;

            // Si el nodo ya venía con un nivel guardado, lo usamos. Si no, usamos el nuevo.
            const nivelActual = n.nivel !== undefined ? n.nivel : nivelAsignado;
            const esSemilla = (grupo === "Central");

            return {
                id: id,
                label: titulo,
                shape: 'circularImage',
                image: posterUrl,
                size: esSemilla ? 40 : 25,
                color: {
                    border: yaExpandido ? "#ffc107" : (esVisto ? "#6c757d" : (esSemilla ? "#0078d4" : "#28a745")),
                    background: "#1a1a1a"
                },
                imagePadding: 0,
                shapeProperties: { useImageSize: false },
                chosen: true,
                font: { color: '#ffffff', strokeWidth: 2, strokeColor: '#000000' },
                opacity: (esVisto || yaExpandido) ? 0.6 : 1,
                expandido: yaExpandido,
                nivel: nivelActual, // Guardamos el nivel en la memoria del nodo

                x: esSemilla ? 0 : (n.x || undefined),
                y: esSemilla ? 0 : (n.y || undefined),
                fixed: esSemilla ? { x: true, y: true } : false
            };
        }

        // NUEVO: Le pasamos el nivel a la flecha para que pinte el color
        function transformarArista(e, nivel = 1) {
            const source = e.sourceId || e.SourceId;
            const target = e.targetId || e.TargetId;
            const relacion = e.relacion || e.Relacion;
            const colorArista = getColorArista(nivel); // Buscamos el color en la paleta

            return {
                from: source,
                to: target,
                label: relacion,
                color: { color: colorArista, highlight: colorArista, hover: colorArista } // Aplicamos el color
            };
        }

        window.inyectarNodos = (nuevoGrafo) => {
            const nuevosNodosRaw = nuevoGrafo.nodos || nuevoGrafo.Nodos;
            const nuevasAristasRaw = nuevoGrafo.aristas || nuevoGrafo.Aristas;

            let padreX = 0;
            let padreY = 0;
            let padreNivel = 0; // Buscamos en qué nivel estaba el padre

            if (nuevasAristasRaw.length > 0) {
                const parentId = nuevasAristasRaw[0].sourceId || nuevasAristasRaw[0].SourceId;
                const parentPos = network.getPositions([parentId])[parentId];
                const nodoPadre = nodes.get(parentId);

                if (parentPos) {
                    padreX = parentPos.x;
                    padreY = parentPos.y;
                }
                if (nodoPadre) {
                    padreNivel = nodoPadre.nivel || 0;
                }
            }

            const nuevoNivel = padreNivel + 1; // Los hijos van a tener un nivel más que el padre

            nuevosNodosRaw.forEach((n, index) => {
                const id = n.id || n.Id;
                if (!nodes.get(id)) {
                    let nodoNuevo = transformarNodo(n, nuevoNivel); // Nace con el nuevo nivel
                    const angulo = (2 * Math.PI / nuevosNodosRaw.length) * index;
                    const radio = 200;
                    nodoNuevo.x = padreX + radio * Math.cos(angulo);
                    nodoNuevo.y = padreY + radio * Math.sin(angulo);
                    nodes.add(nodoNuevo);
                }
            });

            nuevasAristasRaw.forEach(e => {
                const source = e.sourceId || e.SourceId;
                const target = e.targetId || e.TargetId;
                const exists = edges.get({
                    filter: (item) => item.from === source && item.to === target
                });
                if (exists.length === 0) {
                    edges.add(transformarArista(e, nuevoNivel)); // La flecha se pinta del nuevo nivel
                }
            });

            network.setOptions({ physics: { enabled: true } });
            network.once("stabilized", function () {
                network.setOptions({ physics: { enabled: false } });
            });
        };

        window.marcarNodoComoExpandido = (id) => {
            if (nodes && nodes.get(id)) {
                nodes.update({
                    id: id,
                    expandido: true,
                    color: { border: "#ffc107" },
                    opacity: 0.6
                });
            }
        };

        window.obtenerSnapshotGrafo = () => {
            if (!network || !nodes || !edges) return "";
            const posiciones = network.getPositions();
            const nodosSnapshot = nodes.get().map(n => {
                return {
                    ...n,
                    x: posiciones[n.id] ? posiciones[n.id].x : 0,
                    y: posiciones[n.id] ? posiciones[n.id].y : 0,
                    expandido: n.expandido,
                    nivel: n.nivel // Guardamos el nivel en la DB para que no se pierda el color al recargar
                };
            });
            const aristasSnapshot = edges.get();
            return JSON.stringify({ nodos: nodosSnapshot, aristas: aristasSnapshot });
        };

        window.obtenerIdsNodos = () => {
            if (!nodes) return [];
            return nodes.getIds();
        };

        window.cargarMapaDesdeJson = (jsonString, dotNetHelper) => {
            dotNetReference = dotNetHelper;
            const container = document.getElementById('graph-container');
            if (!container || !jsonString) return;

            const data = JSON.parse(jsonString);

            nodes = new vis.DataSet(data.nodos);
            edges = new vis.DataSet(data.aristas);

            const configCarga = { ...opcionesGrafo, physics: { enabled: false } };
            network = new vis.Network(container, { nodes, edges }, configCarga);

            configurarEventosClic();
            bloquearNodosPadres();
        };

        function bloquearNodosPadres() {
            if (!nodes || !edges) return;
            const aristas = edges.get();
            const nodosPadresIds = [...new Set(aristas.map(e => e.from))];

            nodosPadresIds.forEach(id => {
                const nodo = nodes.get(id);
                if (nodo && !nodo.expandido) {
                    nodes.update({
                        id: id,
                        expandido: true,
                        color: { border: "#ffc107" },
                        opacity: 0.6
                    });
                }
            });
        }
    </script>
</body>

</html>
